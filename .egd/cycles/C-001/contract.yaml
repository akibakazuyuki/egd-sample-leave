# EGD cycle contract C-001. Approved by kazu at Gate 1 (2026-11-25).
id: C-001
outcome: 従業員が有給残日数の範囲内で、1日・半日・期間を指定して有給休暇を申請できる
risk: L3
risk_reason: 休暇日数の計算（土日・祝日の除外、残日数の減算）を含むため
examples:
  - id: EX-001
    given: 今日は2026-12-01、残5日
    when: 2026-12-02を1日申請
    then: 成功、残4日
  - id: EX-002
    given: 今日は2026-12-01、残0日
    when: 2026-12-02を1日申請
    then: 不可「有給残日数が足りません」、残0日のまま
  - id: EX-003
    given: 今日は2026-12-01、残0.5日
    when: 2026-12-02を半日申請
    then: 成功、残0日
  - id: EX-004
    given: 今日は2026-12-01、残0.5日
    when: 2026-12-02を1日申請
    then: 不可「有給残日数が足りません」、残0.5日のまま
  - id: EX-005
    given: 今日は2026-12-01、残5日、2026-12-09（水）を申請済み
    when: 2026-12-08（火）〜2026-12-10（木）を申請
    then: 不可「申請済みの日と重なっています」、残4日のまま
  - id: EX-006
    given: 今日は2026-12-01、残5日
    when: 2026-12-02を0.25日申請
    then: 不可「1日または半日で指定してください」、残5日のまま
  - id: EX-007
    given: 今日は2026-12-01、残5日
    when: 2026-12-07（月）〜2026-12-09（水）を申請
    then: 3日として成功、残2日
  - id: EX-008
    given: 今日は2026-12-01、残2日
    when: 2026-12-07（月）〜2026-12-09（水）を申請
    then: 不可「有給残日数が足りません」、残2日のまま
  - id: EX-009
    given: 今日は2026-12-01、残5日
    when: 2026-12-04（金）〜2026-12-07（月）を申請
    then: 土日を除く2日として成功、残3日
  - id: EX-010
    given: 今日は2026-12-01、残5日
    when: 2027-01-08（金）〜2027-01-12（火）を申請（2027-01-11は成人の日）
    then: 土日と祝日を除く2日として成功、残3日
  - id: EX-011
    given: 今日は2026-12-01、残5日
    when: 2026-11-30を1日申請
    then: 不可「過去の日付は申請できません」、残5日のまま
rules:
  - 申請単位は「1日」「半日」「期間（開始日〜終了日）」のいずれか。半日は1日だけの申請で使える
  - 期間の日数は、土曜・日曜・国民の祝日を除いた日数で数える
  - 残日数が足りない場合は、一部だけ通すことはせず申請全体を不可にする
  - 申請済みの日と1日でも重なる申請は不可
  - 今日より前の日付を含む申請は不可（今日は可）
  - 残日数は申請した時点で減らす（承認フローは次のサイクル）
invariants:
  - 有給残日数は負にならない
  - 不可になった申請では残日数も申請済みの日も変わらない
open_questions: []
overrides: {}
